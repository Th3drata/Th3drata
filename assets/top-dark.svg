<svg xmlns="http://www.w3.org/2000/svg" width="880" height="524" viewBox="0 0 880 524" role="img" aria-label="man oscar: Oscar Albert, software developer and maths and CS student. Builds web apps in TypeScript, iOS apps in Swift and low-level tools in C and C++."><style>text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:14px}</style><text x="0" y="22" fill="#7ee787" font-weight="400" text-anchor="start" xml:space="preserve">~ $</text><clipPath id="type"><rect x="36" y="0" height="40" width="77"><animate attributeName="width" begin="0s" dur="0.81s" calcMode="discrete" values="0;9;17;26;34;43;52;60;69;77" fill="freeze"/></rect></clipPath><g clip-path="url(#type)"><text x="36" y="22" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">man oscar</text></g><text x="0" y="66" fill="#8b949e" font-weight="400" text-anchor="start" xml:space="preserve">OSCAR(1)</text><text x="440.0" y="66" fill="#8b949e" font-weight="400" text-anchor="middle" xml:space="preserve">User Commands</text><text x="880" y="66" fill="#8b949e" font-weight="400" text-anchor="end" xml:space="preserve">OSCAR(1)</text><path d="M0 78.5H880" stroke="#30363d"/><text x="0" y="114" fill="#f0f6fc" font-weight="700" text-anchor="start" xml:space="preserve">NAME</text><text x="56" y="144" fill="#f0f6fc" font-weight="700" text-anchor="start" xml:space="preserve">oscar</text><text x="108" y="144" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">— Oscar Albert, software developer and maths &amp; CS student</text><text x="0" y="190" fill="#f0f6fc" font-weight="700" text-anchor="start" xml:space="preserve">SYNOPSIS</text><text x="56" y="220" fill="#f0f6fc" font-weight="700" text-anchor="start" xml:space="preserve">oscar</text><text x="98.15" y="220" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve"> [</text><text x="115.01" y="220" fill="#ffa657" font-weight="400" text-anchor="start" xml:space="preserve">--web</text><text x="157.16" y="220" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">] [</text><text x="182.45" y="220" fill="#ffa657" font-weight="400" text-anchor="start" xml:space="preserve">--ios</text><text x="224.6" y="220" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">] [</text><text x="249.89" y="220" fill="#ffa657" font-weight="400" text-anchor="start" xml:space="preserve">--low-level</text><text x="342.62" y="220" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">] </text><text x="359.48" y="220" fill="#ffa657" font-weight="400" text-anchor="start" text-decoration="underline" xml:space="preserve">idea</text><text x="0" y="266" fill="#f0f6fc" font-weight="700" text-anchor="start" xml:space="preserve">DESCRIPTION</text><text x="56" y="296" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">Takes an idea and ships it: web apps in TypeScript, native iOS apps in Swift,</text><text x="56" y="320" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">and tools that run close to the metal in C and C++. Plays CTFs on HackTheBox</text><text x="56" y="344" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">and TryHackMe in its spare cycles.</text><text x="0" y="390" fill="#f0f6fc" font-weight="700" text-anchor="start" xml:space="preserve">OPTIONS</text><text x="56" y="420" fill="#ffa657" font-weight="400" text-anchor="start" xml:space="preserve">--web</text><text x="184" y="420" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">TypeScript, React, Next.js, Node.js, Supabase, SQL</text><text x="56" y="444" fill="#ffa657" font-weight="400" text-anchor="start" xml:space="preserve">--ios</text><text x="184" y="444" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">Swift, SwiftUI</text><text x="56" y="468" fill="#ffa657" font-weight="400" text-anchor="start" xml:space="preserve">--low-level</text><text x="184" y="468" fill="#c9d1d9" font-weight="400" text-anchor="start" xml:space="preserve">C, C++, Python, Bash, Linux</text><text x="0" y="514" fill="#f0f6fc" font-weight="700" text-anchor="start" xml:space="preserve">EXAMPLES</text></svg>